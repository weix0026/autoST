# conda env create -f environment.yml && conda activate autost
# Tested with the versions below (Windows 11, NVIDIA RTX 5000 Ada, CUDA 12.8).
#
# PyTorch comes from conda-forge with everything else. Do NOT pip-install
# torch into this environment: on Windows the pip wheel loads conda-forge's
# OpenMP library instead of its own and fails on import ("WinError 127 ...
# shm.dll"). Without an NVIDIA GPU, change the pytorch line to
#   - pytorch=2.9.1=cpu*
name: autost
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pytorch=2.9.1=cuda128*
  - numpy=2.3
  - scipy=1.16
  - pandas=2.3
  - pyyaml=6.0
  - matplotlib=3.10
  - pytest
  - pip
